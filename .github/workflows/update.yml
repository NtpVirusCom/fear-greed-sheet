name: CNN Fear Greed

on:

  workflow_dispatch:

  schedule:

    - cron: "*/10 * * * *"

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5

      with:

        python-version: "3.12"

    - run: pip install -r requirements.txt

    - name: Run

      env:

        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      run: python update.py
